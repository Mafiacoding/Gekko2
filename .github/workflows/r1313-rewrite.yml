name: R1313 guarded rewrite
on:
  push:
    branches: [r1313-rewrite-staging]
permissions:
  contents: write
jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1313-rewrite-staging
      - name: Patch REGIMM link gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/core/recompiler/ee_jit.c')
          s=p.read_text()
          old='''        /* REGIMM: rt selects the real sub-opcode, not a flat op-only\n         * dispatch like every other entry in this function - only\n         * BLTZ/BGEZ/BLTZL/BGEZL are implemented by ppc_dynarec.c\n         * (Round 896); every other REGIMM rt value (TGEI/TLTI/etc.)\n         * falls through to the interpreter, same as before this round. */\n        uint32_t rt = (instr >> 16) & 0x1Fu;\n        switch (rt) {\n        case 0x18: case 0x19: /* R1270 MTSAB/MTSAH */\n        case 0x00: case 0x01: /* BLTZ / BGEZ */\n        case 0x02: case 0x03: /* BLTZL / BGEZL */\n            return 1;\n'''
          new='''        /* REGIMM: rt selects the real sub-opcode. R1313 admits the\n         * four link variants already implemented by ppc_dynarec.c; keeping\n         * them blocked here silently forced scalar fallback on Wii. */\n        uint32_t rt = (instr >> 16) & 0x1Fu;\n        switch (rt) {\n        case 0x18: case 0x19: /* R1270 MTSAB/MTSAH */\n        case 0x00: case 0x01: /* BLTZ / BGEZ */\n        case 0x02: case 0x03: /* BLTZL / BGEZL */\n        case 0x10: case 0x11: /* BLTZAL / BGEZAL */\n        case 0x12: case 0x13: /* BLTZALL / BGEZALL */\n            return 1;\n'''
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one REGIMM gate, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Run structural audit
        run: python3 tools/audit-ee-jit-coverage.py
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/r1313-rewrite.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/core/recompiler/ee_jit.c
          git commit -m 'R1313: admit native REGIMM link branches through EE JIT gate'
          git push origin HEAD:r1313-rewrite-staging
