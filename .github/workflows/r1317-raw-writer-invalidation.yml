name: R1317 raw EE RAM writer invalidation
on:
  push:
    branches: [dynarec-development-r1308]
    paths: ['.github/workflows/r1317-raw-writer-invalidation.yml']
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynarec-development-r1308
          fetch-depth: 0
      - name: Patch raw EE RAM writer invalidation
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); s=p.read_text()
              assert s.count(old)==1, (path, 'expected one match', s.count(old), old[:100])
              p.write_text(s.replace(old,new,1))

          # A restored checkpoint replaces both the EE RAM allocation and the
          # complete TLB/ASID state. Invalidate process-local precise JIT stamps.
          once('source/core/checkpoint.c',
          '#include "core/ee/ee_core.h"\n',
          '#include "core/ee/ee_core.h"\n#include "core/recompiler/ee_jit.h" /* R1317 checkpoint source/mapping invalidation */\n')
          once('source/core/checkpoint.c',
          '''    ee->ram = era_scratch; /* ownership transferred - this becomes the live EE RAM buffer */\n    ee->ram_size = era_size;\n    ee->bios = ee_bios;\n    iop->ram = ira_scratch; /* ownership transferred - live IOP RAM buffer */''',
          '''    ee->ram = era_scratch; /* ownership transferred - this becomes the live EE RAM buffer */\n    ee->ram_size = era_size;\n    ee->bios = ee_bios;\n    /* R1317: precise JIT generations are process-local and deliberately not\n     * checkpoint state. The restored RAM/TLB image must therefore make every\n     * old RAM-source block and every mapping-sensitive block stale at once. */\n    ee_jit_notify_physical_write(0u, ee->ram_size);\n    ee_jit_notify_mapping_change();\n    iop->ram = ira_scratch; /* ownership transferred - live IOP RAM buffer */''')

          # LOADFILE's fixed-delta DMA model writes physical EE RAM directly.
          once('source/core/ee/ee_core.c',
          '''    if (st->ram && phys < st->ram_size)\n        st->ram[phys] = val;''',
          '''    if (st->ram && phys < st->ram_size) {\n        ee_jit_notify_physical_write(phys, 1u);\n        st->ram[phys] = val;\n    }''')

          # The verified RSPU2 fast RPC copies disc bytes straight into EE RAM.
          once('source/core/ee/ee_core.c',
          '''        if(command==0x204eu)memcpy(st->ram+physical+copied,bytes,chunk);\n        else memcpy(spu2_mixer_get_ram()+physical+copied,bytes,chunk);''',
          '''        if(command==0x204eu) {\n            memcpy(st->ram+physical+copied,bytes,chunk);\n            ee_jit_notify_physical_write(physical+copied,chunk);\n        } else memcpy(spu2_mixer_get_ram()+physical+copied,bytes,chunk);''')

          # Keep the opt-in legacy frame repair coherent with code-page stamps too.
          once('source/core/ee/ee_core.c',
          '''            for (k = 0; k < 8; k++) q[k] = (uint8_t)(ra >> (8u * k));\n            r1249_repairs++;''',
          '''            for (k = 0; k < 8; k++) q[k] = (uint8_t)(ra >> (8u * k));\n            ee_jit_notify_physical_write(0x01045a00u, 8u);\n            r1249_repairs++;''')

          # Re-initializing the EE in the same process replaces all RAM/TLB state,
          # while executable JIT caches are global. Bump generations after reset.
          once('source/core/ee/ee_core.c',
          '''    dma_bind_ee_ram(g_state.ram, g_state.ram_size); /* chain-mode DMA reads tags/data from here */\n    dma_set_ee_write_notify(ee_jit_notify_physical_write); /* R1316 code-page generations */''',
          '''    dma_bind_ee_ram(g_state.ram, g_state.ram_size); /* chain-mode DMA reads tags/data from here */\n    dma_set_ee_write_notify(ee_jit_notify_physical_write); /* R1316 code-page generations */\n    /* R1317: a same-process EE re-init must stale code compiled from the\n     * previous RAM/TLB image, even though the JIT caches themselves persist. */\n    ee_jit_notify_physical_write(0u, g_state.ram_size);\n    ee_jit_notify_mapping_change();''')

          # Permanent static guard for the bypass paths found by the R1317 audit.
          Path('tools/audit_ee_ram_writer_invalidation.py').write_text(r'''#!/usr/bin/env python3
"""Guard direct EE-RAM writers that bypass ee_mem_write* against stale JIT source pages."""
from pathlib import Path
import sys

root=Path(__file__).resolve().parents[1]
ee=(root/'source/core/ee/ee_core.c').read_text()
ck=(root/'source/core/checkpoint.c').read_text()
dma=(root/'source/hw/dma.c').read_text()
errors=[]

def need(text, token, label):
    if token not in text: errors.append(label)

need(ee, 'ee_jit_notify_physical_write(phys, 1u);\n        st->ram[phys] = val;',
     'LOADFILE raw RAM byte writer is not generation-notified')
need(ee, 'memcpy(st->ram+physical+copied,bytes,chunk);\n            ee_jit_notify_physical_write(physical+copied,chunk);',
     'RSPU2 direct EE RAM copy is not generation-notified')
need(ee, 'ee_jit_notify_physical_write(0x01045a00u, 8u);',
     'legacy frame repair is not generation-notified')
need(ee, 'ee_jit_notify_physical_write(0u, g_state.ram_size);\n    ee_jit_notify_mapping_change();',
     'EE re-init does not invalidate old source/mapping generations')
need(ck, '#include "core/recompiler/ee_jit.h"',
     'checkpoint loader lacks JIT invalidation API')
need(ck, 'ee_jit_notify_physical_write(0u, ee->ram_size);\n    ee_jit_notify_mapping_change();',
     'checkpoint RAM/TLB replacement does not invalidate JIT generations')
# R1316 DMA bypasses stay guarded as part of the same invariant.
need(dma, 'if (g_ee_write_notify) g_ee_write_notify(dst, 16u);',
     'fromSPR direct EE RAM writer lost its JIT notification')
need(dma, 'if (g_ee_write_notify) g_ee_write_notify(written_madr, len);',
     'inbound DMA direct EE RAM writer lost its JIT notification')

if errors:
    print('EE RAM writer invalidation audit: FAIL', file=sys.stderr)
    for e in errors: print('  - '+e, file=sys.stderr)
    raise SystemExit(1)
print('EE RAM writer invalidation audit: PASS')
print('  checkpoint/re-init, LOADFILE, RSPU2, legacy repair and DMA bypass writers are generation-aware')
''')

          # Keep unreleased dynarec notes aligned with the verified source arc.
          p=Path('docs/DYNAREC-WORKING-NOTES.md'); s=p.read_text()
          marker='## R1317 — raw EE RAM writer invalidation'
          if marker not in s:
              s += '''\n\n## R1317 — raw EE RAM writer invalidation\n\nPrecise-block source generations now cover the remaining audited direct EE-RAM bypass writers: checkpoint RAM/TLB replacement, same-process EE re-init, LOADFILE fixed-delta delivery, the verified RSPU2 EE-RAM copy, and the opt-in legacy frame repair. Existing R1316 CPU stores and DMA inbound/fromSPR notifications remain guarded by a permanent static audit. This is source/mapping coherency work only; it is not a Wii performance or hardware-certification claim.\n'''
              p.write_text(s)
          PY
      - name: Structural audits
        run: |
          python3 tools/audit_ee_ram_writer_invalidation.py
          python3 tools/audit_mmi_coverage_internal.py
          python3 tools/audit-ee-jit-coverage.py
      - name: Full host regression suite
        run: bash tests/run_test.sh --all
      - name: Commit verified R1317
        run: |
          rm -f .github/workflows/r1317-raw-writer-audit.yml .github/workflows/r1317-raw-writer-invalidation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R1317: invalidate remaining raw EE RAM writers'
          git push origin HEAD:dynarec-development-r1308
