name: R1330 game compatibility

on:
  workflow_dispatch:
  push:
    branches: [r1330-game-compat-audit]
    paths:
      - 'source/core/ee_elf_loader.c'
      - 'tests/test_ee_elf_loader.c'
      - 'source/core/iso_loader.c'
      - 'include/core/iso_loader.h'
      - 'tests/test_iso_loader.c'
      - 'tests/test_iso_nested_path.c'
      - 'tests/test_frontend_browser.c'
      - 'tests/test_iop_cdrom_legacy.c'
      - 'source/hw/**cdvd**'
      - 'include/core/hw/**cdvd**'
      - 'tests/test_iop_cdvd.c'
      - 'source/core/ee/ee_core.c'
      - 'source/core/**sif**'
      - 'source/core/**vif**'
      - 'source/core/**gif**'
      - 'source/core/**vu**'
      - 'source/core/**gs**'
      - '.github/workflows/r1330-game-compat.yml'

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Focused ISO regression
        timeout-minutes: 5
        run: bash tests/run_test.sh test_iso_loader
      - name: Isolate host regressions
        timeout-minutes: 35
        shell: bash
        run: |
          set +e
          fail=0
          for f in tests/test_*.c; do
            name="$(basename "$f" .c)"
            echo "::group::$name"
            if timeout --signal=TERM --kill-after=5s 90s bash tests/run_test.sh "$name"; then
              echo "PASS $name"
            else
              rc=$?
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                echo "HANG $name (timeout rc=$rc)"
              else
                echo "FAIL $name (rc=$rc)"
              fi
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

  wii:
    needs: host
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wii cross-build
        run: make -j2
      - name: Verify ELF/DOL
        run: |
          test -s Gekko2.elf
          test -s Gekko2.dol
