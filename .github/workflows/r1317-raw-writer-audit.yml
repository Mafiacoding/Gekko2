name: R1317 raw EE RAM writer audit
on:
  push:
    branches: [dynarec-development-r1308]
    paths: ['.github/workflows/r1317-raw-writer-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynarec-development-r1308
          fetch-depth: 0
      - name: Inventory raw RAM writes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pats=[
            re.compile(r'\b(?:st|ee|g_state)->?ram\s*\['),
            re.compile(r'\b(?:st|ee|g_state)\.ram\s*\['),
            re.compile(r'\bg_ee_ram\s*\+'),
            re.compile(r'\b(?:memcpy|memset)\s*\([^;\n]*\bram\b'),
            re.compile(r'\b(?:st|ee)->ram\s*='),
          ]
          for p in Path('source').rglob('*.[ch]'):
            for n,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
              if any(x.search(line) for x in pats):
                print(f'{p}:{n}:{line.strip()}')
          PY
