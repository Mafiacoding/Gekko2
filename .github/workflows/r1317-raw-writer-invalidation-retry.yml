name: R1317 raw EE RAM writer invalidation retry
on:
  push:
    branches: [dynarec-development-r1308]
    paths: ['.github/workflows/r1317-raw-writer-invalidation-retry.yml']
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynarec-development-r1308
          fetch-depth: 0
      - name: Patch R1317 raw writers
        run: |
          python3 <<'PY'
          from pathlib import Path
          def once(path, old, new):
              p=Path(path); s=p.read_text()
              assert s.count(old)==1, (path, s.count(old), old[:100])
              p.write_text(s.replace(old,new,1))
          once('source/core/checkpoint.c','#include "core/ee/ee_core.h"\n','#include "core/ee/ee_core.h"\n#include "core/recompiler/ee_jit.h" /* R1317 checkpoint source/mapping invalidation */\n')
          once('source/core/checkpoint.c','''    ee->ram = era_scratch; /* ownership transferred - this becomes the live EE RAM buffer */\n    ee->ram_size = era_size;\n    ee->bios = ee_bios;\n    iop->ram = ira_scratch; /* ownership transferred - live IOP RAM buffer */''','''    ee->ram = era_scratch; /* ownership transferred - this becomes the live EE RAM buffer */\n    ee->ram_size = era_size;\n    ee->bios = ee_bios;\n    /* R1317: process-local precise JIT stamps are not checkpoint state. */\n    ee_jit_notify_physical_write(0u, ee->ram_size);\n    ee_jit_notify_mapping_change();\n    iop->ram = ira_scratch; /* ownership transferred - live IOP RAM buffer */''')
          once('source/core/ee/ee_core.c','''    if (st->ram && phys < st->ram_size)\n        st->ram[phys] = val;''','''    if (st->ram && phys < st->ram_size) {\n        ee_jit_notify_physical_write(phys, 1u);\n        st->ram[phys] = val;\n    }''')
          once('source/core/ee/ee_core.c','''        if(command==0x204eu)memcpy(st->ram+physical+copied,bytes,chunk);\n        else memcpy(spu2_mixer_get_ram()+physical+copied,bytes,chunk);''','''        if(command==0x204eu) {\n            memcpy(st->ram+physical+copied,bytes,chunk);\n            ee_jit_notify_physical_write(physical+copied,chunk);\n        } else memcpy(spu2_mixer_get_ram()+physical+copied,bytes,chunk);''')
          once('source/core/ee/ee_core.c','''            for (k = 0; k < 8; k++) q[k] = (uint8_t)(ra >> (8u * k));\n            r1249_repairs++;''','''            for (k = 0; k < 8; k++) q[k] = (uint8_t)(ra >> (8u * k));\n            ee_jit_notify_physical_write(0x01045a00u, 8u);\n            r1249_repairs++;''')
          once('source/core/ee/ee_core.c','''    dma_bind_ee_ram(g_state.ram, g_state.ram_size); /* chain-mode DMA reads tags/data from here */\n    dma_set_ee_write_notify(ee_jit_notify_physical_write); /* R1316 code-page generations */''','''    dma_bind_ee_ram(g_state.ram, g_state.ram_size); /* chain-mode DMA reads tags/data from here */\n    dma_set_ee_write_notify(ee_jit_notify_physical_write); /* R1316 code-page generations */\n    /* R1317: same-process EE re-init replaces the prior RAM/TLB image. */\n    ee_jit_notify_physical_write(0u, g_state.ram_size);\n    ee_jit_notify_mapping_change();''')
          audit_lines = [
              '#!/usr/bin/env python3',
              '"""Guard direct EE-RAM writers that bypass ee_mem_write* against stale JIT source pages."""',
              'from pathlib import Path',
              'import sys',
              "root=Path(__file__).resolve().parents[1]",
              "ee=(root/'source/core/ee/ee_core.c').read_text()",
              "ck=(root/'source/core/checkpoint.c').read_text()",
              "dma=(root/'source/hw/dma.c').read_text()",
              'errors=[]',
              'def need(text, token, label):',
              '    if token not in text: errors.append(label)',
              "need(ee, 'ee_jit_notify_physical_write(phys, 1u);\\n        st->ram[phys] = val;', 'LOADFILE raw RAM writer lacks notification')",
              "need(ee, 'memcpy(st->ram+physical+copied,bytes,chunk);\\n            ee_jit_notify_physical_write(physical+copied,chunk);', 'RSPU2 raw RAM copy lacks notification')",
              "need(ee, 'ee_jit_notify_physical_write(0x01045a00u, 8u);', 'legacy frame repair lacks notification')",
              "need(ee, 'ee_jit_notify_physical_write(0u, g_state.ram_size);\\n    ee_jit_notify_mapping_change();', 'EE re-init lacks full invalidation')",
              "need(ck, '#include \\\"core/recompiler/ee_jit.h\\\"', 'checkpoint lacks JIT API')",
              "need(ck, 'ee_jit_notify_physical_write(0u, ee->ram_size);\\n    ee_jit_notify_mapping_change();', 'checkpoint restore lacks invalidation')",
              "need(dma, 'if (g_ee_write_notify) g_ee_write_notify(dst, 16u);', 'fromSPR DMA lost notification')",
              "need(dma, 'if (g_ee_write_notify) g_ee_write_notify(written_madr, len);', 'inbound DMA lost notification')",
              "if errors:",
              "    print('EE RAM writer invalidation audit: FAIL', file=sys.stderr)",
              "    [print('  - '+e, file=sys.stderr) for e in errors]",
              "    raise SystemExit(1)",
              "print('EE RAM writer invalidation audit: PASS')",
              "print('  checkpoint/re-init, LOADFILE, RSPU2, legacy repair and DMA writers are generation-aware')",
          ]
          Path('tools/audit_ee_ram_writer_invalidation.py').write_text('\n'.join(audit_lines)+'\n')
          p=Path('docs/DYNAREC-WORKING-NOTES.md'); s=p.read_text(); marker='## R1317 — raw EE RAM writer invalidation'
          if marker not in s:
              s += '\n\n'+marker+'\n\nPrecise-block source generations now cover the remaining audited direct EE-RAM bypass writers: checkpoint RAM/TLB replacement, same-process EE re-init, LOADFILE fixed-delta delivery, the verified RSPU2 EE-RAM copy, and the opt-in legacy frame repair. Existing R1316 CPU stores and DMA inbound/fromSPR notifications remain guarded by a permanent static audit. This is source/mapping coherency work only; it is not a Wii performance or hardware-certification claim.\n'
              p.write_text(s)
          PY
      - name: Structural audits
        run: |
          python3 tools/audit_ee_ram_writer_invalidation.py
          python3 tools/audit_mmi_coverage_internal.py
          python3 tools/audit-ee-jit-coverage.py
      - name: Full host regression suite
        run: bash tests/run_test.sh --all
      - name: Commit verified R1317
        run: |
          rm -f .github/workflows/r1317-raw-writer-audit.yml .github/workflows/r1317-raw-writer-invalidation.yml .github/workflows/r1317-raw-writer-invalidation-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R1317: invalidate remaining raw EE RAM writers'
          git push origin HEAD:dynarec-development-r1308
