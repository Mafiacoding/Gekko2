name: R1318 precise cache collision eviction
on:
  push:
    branches: [dynarec-development-r1308]
    paths: ['.github/workflows/r1318-cache-eviction.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynarec-development-r1308
          fetch-depth: 0
      - name: Apply guarded R1318 patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); s=p.read_text()
              assert s.count(old)==1, (path, s.count(old), old[:100])
              p.write_text(s.replace(old,new,1))

          once('include/core/recompiler/ee_jit.h',
          '''uint64_t ee_jit_get_block_count(void);\nuint64_t ee_jit_get_block_retired(void);''',
          '''uint64_t ee_jit_get_block_count(void);\nuint64_t ee_jit_get_block_retired(void);\n/* R1318: number of valid precise blocks displaced by direct-map collisions. */\nuint64_t ee_jit_get_block_evictions(void);''')

          once('source/core/recompiler/ee_jit.c',
          '''typedef struct {\n uint32_t pc,words[8],count;\n uint32_t source_page,source_generation,mapping_generation;\n ee_precise_fn fn;\n} ee_precise_slot;\nstatic ee_precise_slot precise_cache[256];\nstatic uint32_t precise_page_generation[EE_PRECISE_RAM_PAGES];\nstatic uint32_t precise_mapping_generation;\nstatic uint64_t precise_runs,precise_retired;\nstatic int precise_active;''',
          '''typedef struct {\n uint32_t pc,words[8],count;\n uint32_t source_page,source_generation,mapping_generation;\n uint32_t serial; /* R1318: non-zero identity of this installed allocation. */\n ee_precise_fn fn;\n} ee_precise_slot;\nstatic ee_precise_slot precise_cache[256];\nstatic uint32_t precise_page_generation[EE_PRECISE_RAM_PAGES];\nstatic uint32_t precise_mapping_generation;\nstatic uint32_t precise_serial_source;\nstatic uint64_t precise_runs,precise_retired,precise_evictions;\nstatic int precise_active;\n\nstatic inline unsigned ee_precise_cache_index(uint32_t pc)\n{\n return ((pc>>2)^(pc>>12))&255u;\n}''')

          once('source/core/recompiler/ee_jit.c',
          '''static void ee_precise_bump(uint32_t *generation)\n{\n if(++*generation==0u)*generation=1u;\n}\nvoid ee_jit_notify_physical_write''',
          '''static void ee_precise_bump(uint32_t *generation)\n{\n if(++*generation==0u)*generation=1u;\n}\nstatic uint32_t ee_precise_next_serial(void)\n{\n ee_precise_bump(&precise_serial_source);\n return precise_serial_source;\n}\n/* R1318: publish a replacement only after translation/finalization succeeded.\n * A live chain pins all installed allocations via precise_active, so failed or\n * nested installs leave the old slot byte-for-byte intact. */\nstatic int ee_precise_install_slot(ee_precise_slot *slot,uint32_t pc,\n const uint32_t *words,unsigned count,uint32_t source_page,\n uint32_t source_generation,uint32_t mapping_generation,ee_precise_fn fn)\n{\n if(!slot||!words||!fn||count<2u||count>8u||precise_active)return 0;\n ee_precise_slot next;memset(&next,0,sizeof(next));\n next.pc=pc;next.count=count;memcpy(next.words,words,count*4u);\n next.source_page=source_page;next.source_generation=source_generation;\n next.mapping_generation=mapping_generation;next.serial=ee_precise_next_serial();\n next.fn=fn;\n ee_precise_fn old=slot->fn;\n int displaced=old&&(slot->pc!=pc||slot->count!=count||\n                    memcmp(slot->words,words,count*4u)!=0);\n *slot=next;\n if(old&&old!=fn){if(displaced)precise_evictions++;free((void*)old);}\n return 1;\n}\nstatic void ee_precise_release_slot(ee_precise_slot *slot)\n{\n if(!slot||precise_active)return;\n if(slot->fn)free((void*)slot->fn);\n memset(slot,0,sizeof(*slot));\n}\nvoid ee_jit_notify_physical_write''')

          once('source/core/recompiler/ee_jit.c',
          '''uint64_t ee_jit_get_block_count(void){return precise_runs;}\nuint64_t ee_jit_get_block_retired(void){return precise_retired;}''',
          '''uint64_t ee_jit_get_block_count(void){return precise_runs;}\nuint64_t ee_jit_get_block_retired(void){return precise_retired;}\nuint64_t ee_jit_get_block_evictions(void){return precise_evictions;}''')

          p=Path('source/core/recompiler/ee_jit.c'); s=p.read_text()
          s=s.replace('&precise_cache[((st->pc>>2)^(st->pc>>12))&255u]','&precise_cache[ee_precise_cache_index(st->pc)]')
          s=s.replace('&precise_cache[((pc>>2)^(pc>>12))&255u]','&precise_cache[ee_precise_cache_index(pc)]')
          s=s.replace('&precise_cache[((start>>2)^(start>>12))&255u]','&precise_cache[ee_precise_cache_index(start)]')
          assert '((st->pc>>2)^(st->pc>>12))&255u' not in s
          assert '((pc>>2)^(pc>>12))&255u' not in s
          assert '((start>>2)^(start>>12))&255u' not in s
          p.write_text(s)

          once('source/core/recompiler/ee_jit.c',
          ''' if(!slot->fn||slot->pc!=st->pc||slot->count<2u||slot->count>remaining)return 0;\n if(!ee_precise_slot_generation_current(slot))return 0;\n uint32_t word;\n if(!ee_core_block_peek(st,st->pc,&word)||word!=slot->words[0])return 0;\n precise_native_successors++;\n return ((uint64_t)(uint32_t)(uintptr_t)slot->fn<<32)|slot->count;''',
          ''' if(!slot->fn||!slot->serial||slot->pc!=st->pc||slot->count<2u||slot->count>remaining)return 0;\n uint32_t serial=slot->serial;ee_precise_fn fn=slot->fn;\n if(!ee_precise_slot_generation_current(slot))return 0;\n uint32_t word;\n if(!ee_core_block_peek(st,st->pc,&word)||word!=slot->words[0])return 0;\n /* Identity is rechecked after every live source lookup. This is redundant\n  * today because precise_active forbids eviction, and makes that invariant\n  * explicit for future cache/link changes. */\n if(slot->serial!=serial||slot->fn!=fn||slot->pc!=st->pc)return 0;\n precise_native_successors++;\n return ((uint64_t)(uint32_t)(uintptr_t)fn<<32)|slot->count;''')

          once('source/core/recompiler/ee_jit.c',
          '''  ee_precise_fn fn=(ee_precise_fn)ppc_dynarec_finalize(&c);\n  if(!fn){ppc_dynarec_free(&c);return 0;}\n  if(slot->fn)free((void*)slot->fn);\n  slot->fn=fn;slot->pc=pc;slot->count=count;memcpy(slot->words,words,count*4u);\n }\n /* A stale epoch with byte-identical code reuses the compiled PPC safely;\n  * only the validated source/mapping stamp changes. */\n slot->source_page=source_page;slot->source_generation=source_generation;\n slot->mapping_generation=mapping_generation;''',
          '''  ee_precise_fn fn=(ee_precise_fn)ppc_dynarec_finalize(&c);\n  if(!fn){ppc_dynarec_free(&c);return 0;}\n  if(!ee_precise_install_slot(slot,pc,words,count,source_page,source_generation,mapping_generation,fn)) {\n   ppc_dynarec_free(&c);return 0;\n  }\n } else {\n  /* A stale epoch with byte-identical code reuses the compiled PPC safely;\n   * only the validated source/mapping stamp changes; its allocation identity\n   * remains stable because no executable buffer was replaced. */\n  slot->source_page=source_page;slot->source_generation=source_generation;\n  slot->mapping_generation=mapping_generation;\n }''')

          once('source/core/recompiler/ee_jit.c',
          ''' if(!n){free((void*)slot->fn);memset(slot,0,sizeof(*slot));}\n return n;''',
          ''' if(!n)ee_precise_release_slot(slot);\n return n;''')

          once('source/core/recompiler/ee_jit.c',
          ''' for(unsigned n=0;n<256;n++)if(precise_cache[n].fn)free((void*)precise_cache[n].fn);\n memset(precise_cache,0,sizeof(precise_cache));\n memset(precise_page_generation,0,sizeof(precise_page_generation));\n precise_mapping_generation=0;precise_runs=precise_retired=0;''',
          ''' for(unsigned n=0;n<256;n++)ee_precise_release_slot(&precise_cache[n]);\n memset(precise_cache,0,sizeof(precise_cache));\n memset(precise_page_generation,0,sizeof(precise_page_generation));\n precise_mapping_generation=0;precise_serial_source=0;\n precise_runs=precise_retired=precise_evictions=0;''')

          Path('tests/test_jit_cache_eviction_r1318.c').write_text(r'''#include <stdio.h>\n#include <stdint.h>\n#include <stdlib.h>\n#include <string.h>\n#include "core/recompiler/ee_jit.c"\n\nstatic int fail(const char *m){fprintf(stderr,"R1318 cache eviction test: %s\\n",m);return 1;}\nstatic ee_precise_fn alloc_fn(void){return (ee_precise_fn)malloc(32u);}\nint main(void)\n{\n    uint32_t a[2]={0x24020001u,0x24420001u};\n    uint32_t b[2]={0x24030002u,0x24630001u};\n    ee_precise_reset_cache();\n    uint32_t pc1=0x00200000u,pc2=pc1+4u;\n    while(ee_precise_cache_index(pc2)!=ee_precise_cache_index(pc1)) pc2+=4u;\n    if(pc1==pc2) return fail("collision search");\n    ee_precise_slot *slot=&precise_cache[ee_precise_cache_index(pc1)];\n    ee_precise_fn f1=alloc_fn(),f2=alloc_fn();\n    if(!f1||!f2)return fail("allocation");\n    if(!ee_precise_install_slot(slot,pc1,a,2u,3u,7u,11u,f1))return fail("first install");\n    uint32_t serial1=slot->serial;\n    if(!serial1||precise_evictions) return fail("initial identity/counter");\n    precise_active=1;\n    if(ee_precise_install_slot(slot,pc2,b,2u,4u,8u,12u,f2))return fail("live replacement accepted");\n    if(slot->fn!=f1||slot->pc!=pc1||slot->serial!=serial1)return fail("live slot mutated");\n    precise_active=0;\n    if(!ee_precise_install_slot(slot,pc2,b,2u,4u,8u,12u,f2))return fail("collision replacement");\n    if(slot->fn!=f2||slot->pc!=pc2||!slot->serial||slot->serial==serial1)return fail("replacement identity");\n    if(precise_evictions!=1u)return fail("eviction count");\n    precise_serial_source=UINT32_MAX;\n    ee_precise_fn f3=alloc_fn();if(!f3)return fail("wrap allocation");\n    ee_precise_slot *other=&precise_cache[(ee_precise_cache_index(pc1)+1u)&255u];\n    if(!ee_precise_install_slot(other,pc1+0x1000u,a,2u,5u,9u,13u,f3))return fail("wrap install");\n    if(other->serial!=1u)return fail("serial wrap did not skip zero");\n    precise_active=1;ee_precise_reset_cache();\n    if(!slot->fn||!other->fn)return fail("active reset released live code");\n    precise_active=0;ee_precise_reset_cache();\n    if(slot->fn||other->fn||precise_serial_source||precise_evictions)return fail("inactive reset");\n    puts("R1318 cache eviction test: PASS");\n    return 0;\n}\n''')

          Path('tools/audit_precise_cache_eviction_r1318.py').write_text(r'''#!/usr/bin/env python3\nfrom pathlib import Path\ns=Path('source/core/recompiler/ee_jit.c').read_text()\nh=Path('include/core/recompiler/ee_jit.h').read_text()\nneed=[\n 'uint32_t serial;',\n 'static int ee_precise_install_slot(',\n 'if(!slot||!words||!fn||count<2u||count>8u||precise_active)return 0;',\n 'next.serial=ee_precise_next_serial();',\n 'if(old&&old!=fn){if(displaced)precise_evictions++;free((void*)old);}',\n 'if(slot->serial!=serial||slot->fn!=fn||slot->pc!=st->pc)return 0;',\n 'if(!n)ee_precise_release_slot(slot);',\n 'for(unsigned n=0;n<256;n++)ee_precise_release_slot(&precise_cache[n]);',\n 'uint64_t ee_jit_get_block_evictions(void){return precise_evictions;}'\n]\nmissing=[x for x in need if x not in s]\nif 'uint64_t ee_jit_get_block_evictions(void);' not in h:missing.append('public eviction getter')\nif missing:\n print('R1318 precise cache audit: FAIL')\n for x in missing:print(' -',x)\n raise SystemExit(1)\nprint('R1318 precise cache audit: PASS')\nprint('  transactional install, active-code pinning, allocation serials and collision eviction accounting present')\n''')

          Path('docs/R1318-WORKING-NOTES.md').write_text('''# R1318 working notes — precise-cache collision and eviction safety\n\nR1318 hardens the 256-entry direct-mapped precise EE block cache. Every successful executable allocation install receives a non-zero serial identity. A colliding block is published only after translation and finalization have succeeded; allocation/translation/finalization failure therefore leaves the old resident block untouched. `precise_active` forbids replacement or release while a native chain may still hold a code pointer.\n\nThe warm successor resolver now snapshots and rechecks allocation identity around its live source lookup in addition to R1316/R1317 source-page and mapping generations. This does not add patched tail links: chaining remains the existing call-based guarded mechanism. Collision replacements are counted for diagnostics.\n\nHost verification covers a real direct-map PC collision, replacement serial change, blocked replacement while active, serial wrap skipping zero, active reset pinning and inactive reset/release. Structural source/mapping/MMI audits and the full host regression suite remain mandatory before the source commit is pushed. These tests are not Wii hardware performance evidence.\n''')
          PY
      - name: Focused R1318 verification
        run: |
          python3 tools/audit_precise_cache_eviction_r1318.py
          python3 tools/audit_ee_ram_writer_invalidation.py
          python3 tools/audit_mmi_coverage_internal.py
          python3 tools/audit-ee-jit-coverage.py
          bash tests/run_test.sh test_jit_cache_eviction_r1318
          bash tests/run_test.sh test_jit_generation_r1316
      - name: Full host regression suite
        run: bash tests/run_test.sh --all
      - name: Commit verified R1318
        run: |
          rm -f .github/workflows/r1318-cache-eviction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R1318: harden precise cache collision eviction'
          git push origin HEAD:dynarec-development-r1308
