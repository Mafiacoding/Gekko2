name: PS2Recomp bridge host test

on:
  pull_request:
    paths:
      - "include/core/recompiler/ps2recomp_bridge.h"
      - "source/core/recompiler/ps2recomp_bridge.c"
      - "include/core/ee/**"
      - "source/core/ee/**"
      - "include/core/recompiler/**"
      - "source/core/recompiler/**"
      - "tests/test_ps2recomp_bridge.c"
      - "tests/test_native_hybrid_compile.py"
      - "tests/test_native_hybrid_execute.c"
      - "tests/test_ee_aot.c"
      - "tests/test_ee_residency_generation.c"
      - "tests/test_ee_exec_lifecycle.c"
      - "experiments/ps2recomp-wii/**"
      - "tools/ee_aot_generate.py"
      - "tools/build_host_core.py"
      - "tests/run_test.sh"
      - ".github/workflows/ps2recomp-bridge-host-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-host-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build and run PS2Recomp bridge regression test
        env:
          GEKKO2_TEST_EXTRA_CFLAGS: >-
            -Ithird_party/libchdr/include
            -Ithird_party/libchdr/deps/lzma-25.01/src
            -Ithird_party/libchdr/deps/miniz-3.1.1
            -Ithird_party/libchdr/deps/zstd-1.5.7
            -Ithird_party/wiidrc
            -ffunction-sections -fdata-sections -Wl,--gc-sections
        run: sh tests/run_test.sh test_ps2recomp_bridge
      - name: Test conservative synthetic ELF control-flow discovery
        run: python3 tests/test_native_hybrid_compile.py
      - name: Execute synthetic ELF through generated AOT and real interpreter fallback
        run: python3 experiments/ps2recomp-wii/run_hybrid_test.py
      - name: Run existing EE AOT regression suite
        run: sh tests/run_test.sh test_ee_aot
      - name: Run existing EE residency-generation regression suite
        run: sh tests/run_test.sh test_ee_residency_generation
      - name: Run existing EE execution-lifecycle regression suite
        run: sh tests/run_test.sh test_ee_exec_lifecycle
