name: R1318 precise cache collision eviction retry3
on:
  push:
    branches: [dynarec-development-r1308]
    paths: ['.github/workflows/r1318-cache-eviction-retry3.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynarec-development-r1308
          fetch-depth: 0
      - name: Apply corrected guarded R1318 patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/r1318-cache-eviction.yml').read_text()
          marker="          from pathlib import Path\n"
          start=text.index(marker, text.index("python3 <<'PY'"))
          end=text.index("\n          PY\n", start)
          body=text[start:end]
          lines=[]
          for line in body.splitlines():
              if not line.strip(): lines.append('')
              else:
                  assert line.startswith('          '), repr(line)
                  lines.append(line[10:])
          script='\n'.join(lines)+'\n'
          bad="assert '((pc>>2)^(pc>>12))&255u' not in s\n"
          assert script.count(bad)==1
          script=script.replace(bad,'',1)
          exec(compile(script,'r1318_guarded_patch','exec'),{'__name__':'__main__'})
          PY
          cat > tests/test_jit_cache_eviction_r1318.c <<'EOF'
          #include <stdio.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include "core/recompiler/ee_jit.c"

          static int fail(const char *m){fprintf(stderr,"R1318 cache eviction test: %s\n",m);return 1;}
          static ee_precise_fn alloc_fn(void){return (ee_precise_fn)malloc(32u);}
          int main(void)
          {
              uint32_t a[2]={0x24020001u,0x24420001u};
              uint32_t b[2]={0x24030002u,0x24630001u};
              ee_precise_reset_cache();
              uint32_t pc1=0x00200000u,pc2=pc1+4u;
              while(ee_precise_cache_index(pc2)!=ee_precise_cache_index(pc1)) pc2+=4u;
              if(pc1==pc2) return fail("collision search");
              ee_precise_slot *slot=&precise_cache[ee_precise_cache_index(pc1)];
              ee_precise_fn f1=alloc_fn(),f2=alloc_fn();
              if(!f1||!f2)return fail("allocation");
              if(!ee_precise_install_slot(slot,pc1,a,2u,3u,7u,11u,f1))return fail("first install");
              uint32_t serial1=slot->serial;
              if(!serial1||precise_evictions) return fail("initial identity/counter");
              precise_active=1;
              if(ee_precise_install_slot(slot,pc2,b,2u,4u,8u,12u,f2))return fail("live replacement accepted");
              if(slot->fn!=f1||slot->pc!=pc1||slot->serial!=serial1)return fail("live slot mutated");
              precise_active=0;
              if(!ee_precise_install_slot(slot,pc2,b,2u,4u,8u,12u,f2))return fail("collision replacement");
              if(slot->fn!=f2||slot->pc!=pc2||!slot->serial||slot->serial==serial1)return fail("replacement identity");
              if(precise_evictions!=1u)return fail("eviction count");
              precise_serial_source=UINT32_MAX;
              ee_precise_fn f3=alloc_fn();if(!f3)return fail("wrap allocation");
              ee_precise_slot *other=&precise_cache[(ee_precise_cache_index(pc1)+1u)&255u];
              if(!ee_precise_install_slot(other,pc1+0x1000u,a,2u,5u,9u,13u,f3))return fail("wrap install");
              if(other->serial!=1u)return fail("serial wrap did not skip zero");
              precise_active=1;ee_precise_reset_cache();
              if(!slot->fn||!other->fn)return fail("active reset released live code");
              precise_active=0;ee_precise_reset_cache();
              if(slot->fn||other->fn||precise_serial_source||precise_evictions)return fail("inactive reset");
              puts("R1318 cache eviction test: PASS");
              return 0;
          }
          EOF
          sed -i 's/^          //' tests/test_jit_cache_eviction_r1318.c
          cat > tools/audit_precise_cache_eviction_r1318.py <<'EOF'
          #!/usr/bin/env python3
          from pathlib import Path
          s=Path('source/core/recompiler/ee_jit.c').read_text()
          h=Path('include/core/recompiler/ee_jit.h').read_text()
          need=[
           'uint32_t serial;',
           'static int ee_precise_install_slot(',
           'if(!slot||!words||!fn||count<2u||count>8u||precise_active)return 0;',
           'next.serial=ee_precise_next_serial();',
           'if(old&&old!=fn){if(displaced)precise_evictions++;free((void*)old);}',
           'if(slot->serial!=serial||slot->fn!=fn||slot->pc!=st->pc)return 0;',
           'if(!n)ee_precise_release_slot(slot);',
           'for(unsigned n=0;n<256;n++)ee_precise_release_slot(&precise_cache[n]);',
           'uint64_t ee_jit_get_block_evictions(void){return precise_evictions;}'
          ]
          missing=[x for x in need if x not in s]
          if 'uint64_t ee_jit_get_block_evictions(void);' not in h:missing.append('public eviction getter')
          if missing:
           print('R1318 precise cache audit: FAIL')
           for x in missing:print(' -',x)
           raise SystemExit(1)
          print('R1318 precise cache audit: PASS')
          print('  transactional install, active-code pinning, allocation serials and collision eviction accounting present')
          EOF
          sed -i 's/^          //' tools/audit_precise_cache_eviction_r1318.py
      - name: Focused R1318 verification
        run: |
          python3 tools/audit_precise_cache_eviction_r1318.py
          python3 tools/audit_ee_ram_writer_invalidation.py
          python3 tools/audit_mmi_coverage_internal.py
          python3 tools/audit-ee-jit-coverage.py
          bash tests/run_test.sh test_jit_cache_eviction_r1318
          bash tests/run_test.sh test_jit_generation_r1316
      - name: Full host regression suite
        run: bash tests/run_test.sh --all
      - name: Commit verified R1318
        run: |
          rm -f .github/workflows/r1318-cache-eviction.yml .github/workflows/r1318-cache-eviction-retry.yml .github/workflows/r1318-cache-eviction-retry2.yml .github/workflows/r1318-cache-eviction-retry3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R1318: harden precise cache collision eviction'
          git push origin HEAD:dynarec-development-r1308
