name: R1315 native MMI coverage
on:
  push:
    branches: [dynarec-development-r1308]
    paths: ['.github/workflows/r1315-mmi-coverage.yml']
  workflow_dispatch:
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynarec-development-r1308
          fetch-depth: 0
      - name: Native MMI acceptance audit
        run: python3 tools/audit_mmi_coverage_internal.py
      - name: EE JIT structural audit
        run: python3 tools/audit-ee-jit-coverage.py
