name: R1330-I Wii FAST performance checkpoint
on:
  push:
    branches: [r1330-game-compat-audit]
    paths:
      - '.github/workflows/r1330i-wii-fast-check.yml'
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Full isolated host suite
        run: |
          set -e
          for f in tests/test_*.c; do
            timeout 180s bash tests/run_test.sh "$(basename "$f" .c)"
          done
  wii:
    runs-on: ubuntu-latest
    needs: host
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: current-20260503
            image: devkitpro/devkitppc:20260503
          - toolchain: legacy-20250102
            image: devkitpro/devkitppc:20250102
    container: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain identity
        run: |
          echo "container=${{ matrix.image }}"
          powerpc-eabi-gcc --version | head -n 1
      - name: Wii FAST JIT cross-build
        run: |
          set -e
          make clean || true
          make -j2 EXTRA_CFLAGS="-DPCSX2WII_FAST"
          test -s Gekko2.elf
          test -s Gekko2.dol
      - name: Upload R1330-I FAST checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: Gekko2-R1330I-Wii-FAST-${{ matrix.toolchain }}
          path: |
            Gekko2.elf
            Gekko2.dol
          if-no-files-found: error
          retention-days: 14
