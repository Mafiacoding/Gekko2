name: R1330-G IRQ event verification
# R1330-G VIF stall/resume gate
on:
  push:
    branches: [r1330-game-compat-audit]
    paths:
      - 'source/hw/vif.c'
      - 'include/core/hw/vif.h'
      - 'source/hw/gif.c'
      - 'source/hw/gs.c'
      - 'include/core/hw/gs.h'
      - 'source/core/ee/ee_core.c'
      - 'include/core/hw/ee_intc.h'
      - 'tests/test_vif.c'
      - 'tests/test_gs_registers.c'
      - '.github/workflows/r1330g-irq-event-check.yml'
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Focused GS VIF IRQ tests
        run: |
          set -e
          bash tests/run_test.sh test_gs_registers
          bash tests/run_test.sh test_vif
      - name: Full isolated host suite
        run: |
          set -e
          for f in tests/test_*.c; do
            timeout 180s bash tests/run_test.sh "$(basename "$f" .c)"
          done
  wii:
    runs-on: ubuntu-latest
    needs: host
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: current-20260503
            image: devkitpro/devkitppc:20260503
          - toolchain: legacy-20250102
            image: devkitpro/devkitppc:20250102
    container: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain identity
        run: |
          echo "container=${{ matrix.image }}"
          powerpc-eabi-gcc --version | head -n 1
          if test -f "${DEVKITPRO}/libogc/include/ogc/libversion.h"; then
            cat "${DEVKITPRO}/libogc/include/ogc/libversion.h"
          elif test -f "${DEVKITPRO}/libogc/include/gccore.h"; then
            grep -R "LIBOGC.*VERSION\|_OGC.*VERSION" "${DEVKITPRO}/libogc/include" 2>/dev/null | head -n 20 || true
          fi
      - name: Wii cross-build
        run: |
          make clean || true
          make -j2
          test -s Gekko2.elf
          test -s Gekko2.dol
      - name: Upload R1330-G Wii checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: Gekko2-R1330G-VIF-IRQ-Checkpoint-${{ matrix.toolchain }}
          path: |
            Gekko2.elf
            Gekko2.dol
          if-no-files-found: error
          retention-days: 14
