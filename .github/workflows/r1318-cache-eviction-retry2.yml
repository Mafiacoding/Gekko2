name: R1318 precise cache collision eviction retry2
on:
  push:
    branches: [dynarec-development-r1308]
    paths: ['.github/workflows/r1318-cache-eviction-retry2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynarec-development-r1308
          fetch-depth: 0
      - name: Apply corrected guarded R1318 patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/r1318-cache-eviction.yml').read_text()
          marker="          from pathlib import Path\n"
          start=text.index(marker, text.index("python3 <<'PY'"))
          end=text.index("\n          PY\n", start)
          body=text[start:end]
          lines=[]
          for line in body.splitlines():
              if not line.strip():
                  lines.append('')
              else:
                  assert line.startswith('          '), repr(line)
                  lines.append(line[10:])
          script='\n'.join(lines)+'\n'
          bad="assert '((pc>>2)^(pc>>12))&255u' not in s\n"
          assert script.count(bad)==1
          script=script.replace(bad,'',1)
          exec(compile(script,'r1318_guarded_patch','exec'),{'__name__':'__main__'})
          PY
      - name: Focused R1318 verification
        run: |
          python3 tools/audit_precise_cache_eviction_r1318.py
          python3 tools/audit_ee_ram_writer_invalidation.py
          python3 tools/audit_mmi_coverage_internal.py
          python3 tools/audit-ee-jit-coverage.py
          bash tests/run_test.sh test_jit_cache_eviction_r1318
          bash tests/run_test.sh test_jit_generation_r1316
      - name: Full host regression suite
        run: bash tests/run_test.sh --all
      - name: Commit verified R1318
        run: |
          rm -f .github/workflows/r1318-cache-eviction.yml .github/workflows/r1318-cache-eviction-retry.yml .github/workflows/r1318-cache-eviction-retry2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R1318: harden precise cache collision eviction'
          git push origin HEAD:dynarec-development-r1308
