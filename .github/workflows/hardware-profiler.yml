name: GEKKO2 Hardware Profiler DOL
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/hardware-profiler/**'
      - '.github/workflows/hardware-profiler.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Wii DOL
        run: |
          docker run --rm -v "$PWD:/src" -w /src/tools/hardware-profiler devkitpro/devkitppc:20260503 make
      - name: Validate DOL against ELF and Wii memory limits
        shell: bash
        run: |
          python3 tools/verify_dol_r1352.py tools/hardware-profiler/gekko2-profiler.dol tools/hardware-profiler/gekko2-profiler.elf | tee tools/hardware-profiler/dol-validation.json
          python3 tools/verify_wii_memory.py tools/hardware-profiler/gekko2-profiler.elf | tee tools/hardware-profiler/memory-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: GEKKO2-Hardware-Profiler-DOL
          path: |
            tools/hardware-profiler/gekko2-profiler.dol
            tools/hardware-profiler/gekko2-profiler.elf
            tools/hardware-profiler/*-validation.json
          if-no-files-found: error
